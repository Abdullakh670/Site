<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inter Milan | Билеты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-inter-black sticky-top">
        <div class="container">
            <a class="navbar-brand text-inter-blue fw-bold fs-3" href="index.html">INTER</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link " href="index.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link " href="history.html">История</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tickets.html">Билеты</a></li>
                    <li class="nav-item"><a class="nav-link " href="store.html">Магазин <span class='badge bg-danger ms-1 cart-badge'>0</span></a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="text-center mb-4">Бронирование билетов</h2>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form id="ticketForm" class="p-4 border rounded shadow-sm bg-light">
                    <div class="mb-3">
                        <label for="matchSelect" class="form-label">Выберите матч</label>
                        <select class="form-select" id="matchSelect">
                            <option data-price="120">Интер - Ювентус (Серия А) — €120</option>
                            <option data-price="150">Интер - Милан (Дерби) — €150</option>
                            <option data-price="85">Интер - Рома (Серия А) — €85</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="nameInput" class="form-label">Имя и Фамилия</label>
                        <input type="text" class="form-control" id="nameInput" placeholder="Введите ваши данные">
                    </div>
                    <div class="mb-3">
                        <label for="ticketCount" class="form-label">Количество билетов</label>
                        <input type="number" class="form-control" id="ticketCount" min="1" max="4" value="1">
                    </div>
                    <div class="mb-3 text-end">
                        <h4 id="totalPrice" class="text-inter-blue fw-bold">Итого к оплате: €120</h4>
                    </div>
                    <button type="submit" class="btn btn-inter w-100 fs-5">Забронировать</button>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
