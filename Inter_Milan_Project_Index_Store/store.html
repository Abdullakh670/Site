<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Store - Inter Milan</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">INTER MILAN</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="store.html">Official Store</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Store Section -->
    <section class="container py-5">
        <h2 class="text-center mb-5 fw-bold">Inter Official Store</h2>
        
        <div class="row">
            <!-- Filters -->
            <div class="col-md-3 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="fw-bold mb-3">Filters</h5>
                        <input type="text" id="searchInput" class="form-control mb-3" placeholder="Search products...">
                        <select id="categoryFilter" class="form-select mb-3">
                            <option value="All">All Categories</option>
                            <option value="Kits">Kits</option>
                            <option value="Training">Training</option>
                            <option value="Accessories">Accessories</option>
                        </select>
                        <select id="priceSort" class="form-select">
                            <option value="default">Sort by Price</option>
                            <option value="low">Low to High</option>
                            <option value="high">High to Low</option>
                        </select>
                    </div>
                </div>

                <!-- Shopping Cart Summary -->
                <div class="card shadow-sm border-0 mt-4 border-warning">
                    <div class="card-body">
                        <h5 class="fw-bold mb-3 text-warning">Shopping Cart 🛒</h5>
                        <ul id="cartItemsList" class="list-group mb-3">
                            <!-- Cart items dynamically rendered here -->
                        </ul>
                        <div class="d-flex justify-content-between fw-bold mb-3">
                            <span>Total:</span>
                            <span id="cartTotal">€0.00</span>
                        </div>
                        <button class="btn btn-warning w-100 fw-bold" onclick="clearCart()">Clear Cart</button>
                    </div>
                </div>
            </div>

            <!-- Products Grid (Dynamically populated by JS) -->
            <div class="col-md-9">
                <div class="row g-4" id="productsGrid">
                    <!-- Products will be appended here by JavaScript -->
                </div>
            </div>
        </div>
    </section>

    <!-- jQuery and Custom JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
